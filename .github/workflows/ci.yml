name: CI

on:
  push:
    branches: ['main']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leados
          POSTGRES_PASSWORD: leados
          POSTGRES_DB: leados_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U leados -d leados_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://leados:leados@localhost:5432/leados_test
      REDIS_URL: redis://localhost:6379
      DATABASE_URL_TEST: postgresql://leados:leados@localhost:5432/leados_test
      REDIS_URL_TEST: redis://localhost:6379/1

      # Boot-time config validation refuses to start without these three, so the API e2e suite
      # could not run here at all: they live in a gitignored .env locally, which is why this was
      # invisible until CI ran for the first time. These are throwaway CI values, not secrets --
      # they sign tokens and encrypt rows in a database that is created and destroyed by this job,
      # and they are deliberately in plain sight rather than in repository secrets so that a run
      # is reproducible. `assertProductionSafety` returns early unless NODE_ENV=production, so the
      # "dev-only" shape is accepted here and would be refused in production, which is the point.
      JWT_ACCESS_SECRET: ci-only-access-secret-not-a-real-secret-0001
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-a-real-secret-0002
      ENCRYPTION_MASTER_KEY: Y2ktb25seS10ZXN0LWtleS1ub3QtYS1zZWNyZXQhISE=
      # The web app refuses a revalidation call without this; same throwaway status as the three
      # above. WEB_ORIGIN is declared so the job's value reaches the task rather than the default.
      WEB_REVALIDATE_SECRET: ci-only-revalidate-secret-not-a-real-secret
      WEB_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Unit tests
        run: pnpm test

      # Isolation suite: proves no tenant can reach another tenant's data.
      # Blocking and non-negotiable — docs/security.md §3, NFR-SEC-1.
      - name: Integration + tenant-isolation tests
        run: pnpm test:int

      - name: Build
        run: pnpm build

  secrets-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # gitleaks-action reports what it found in the job summary and an uploaded artifact, and
      # nowhere else: the check run carries no output, and its own attempt to comment on the PR
      # fails with "Resource not accessible by integration". So a red secret scan says "see job
      # summary for details" and a reviewer has to open a browser to learn whether the build is
      # blocked by a real credential or by a fixture. Mirroring the SARIF into annotations puts the
      # finding where `gh run view` and the checks API can read it.
      - name: Report gitleaks findings
        if: failure()
        run: |
          shopt -s nullglob
          reports=(*.sarif)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::warning::gitleaks failed but left no SARIF report to read"
            exit 0
          fi
          for report in "${reports[@]}"; do
            jq -r '.runs[].results[]
              | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::\(.ruleId) — \(.message.text)"' \
              "$report" || echo "::warning::could not parse $report"
            {
              echo "### gitleaks findings in \`$report\`"
              echo
              jq -r '.runs[].results[]
                | "- **\(.ruleId)** in `\(.locations[0].physicalLocation.artifactLocation.uri)` line \(.locations[0].physicalLocation.region.startLine) — \(.message.text)"' \
                "$report" || true
            } >> "$GITHUB_STEP_SUMMARY"
          done
